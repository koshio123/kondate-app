name: Keep alive

# Supabase の無料枠は1週間アクセスがないとプロジェクトが一時停止するため、
# 週2回、Data API 経由で軽い SELECT を実行する。
# anon に許可されているのは ingredient_categories の読み取りのみ(RLS により行は返らない)。

on:
  schedule:
    # 毎週 月曜・木曜 03:17 UTC(日本時間 12:17)。毎時0分を避けて混雑を回避する
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase Data API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are required"
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/ingredient_categories?select=id&limit=1")
          echo "HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::Supabase keep-alive request failed (HTTP ${status})"
            exit 1
          fi

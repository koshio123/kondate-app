<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4501F}a:hover{color:#8E3E17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 40px 32px; background: #FBF5EC; color: #2A211B; font-family: 'BIZ UDPGothic', sans-serif">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="width: 112px; height: 112px; border-radius: 36px; background: #F6E2D3; display: flex; align-items: center; justify-content: center">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#B4501F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 30h44"></path>
        <path d="M14 30c0 11 8 20 18 20s18-9 18-20"></path>
        <path d="M24 54h16"></path>
        <path d="M24 22c0-3 3-4 3-7M32 22c0-3 3-4 3-7M40 22c0-3 3-4 3-7"></path>
      </svg>
    </div>
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 0.04em">こんだて</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #6E6157; text-align: center">献立づくりと買い物を、<br>ふたりでもっと楽に。</p>
  </div>

  <div style="width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center">
    <button type="button" style="width: 100%; height: 54px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: inherit; font-size: 16px; font-weight: 700; color: #2A211B; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.3 5.7c4.3-4 7-9.9 7-17.2z"></path><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"></path><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"></path></svg>
      Google でログイン
    </button>
    <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6E6157; text-align: center">登録された家族のアカウントだけが利用できます</p>
  </div>

  <sc-if value="{{showError}}" hint-placeholder-val="{{ true }}">
  <div role="alert" style="width: 100%; box-sizing: border-box; border-radius: 14px; background: #FBE9E4; border: 1px solid #EBC3B6; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 700; color: #7C2D12">このアカウントでは利用できません</span>
      <span style="font-size: 12px; line-height: 1.6; color: #7C2D12">家族として登録されていないアカウントです。別のアカウントでログインしてください。</span>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showError":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { showError: this.props.showError ?? true }; }
}
</script>
</body>
</html>

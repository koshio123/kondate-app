<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>料理詳細</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4501F}a:hover{color:#8E3E17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBF5EC; color: #2A211B; font-family: 'BIZ UDPGothic', sans-serif; overflow: hidden">

  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="Proposal.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2A211B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 14px; color: #6E6157">10/13(火)の主菜</span>
    <button type="button" aria-label="お気に入りに追加" aria-pressed="false" style="margin-left: auto; width: 44px; height: 44px; border: none; background: transparent; color: #B4501F; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </button>
  </header>

  <main style="flex-grow: 1; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.35">豚こまとキャベツの味噌炒め</h1>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #2A211B; background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 999px; padding: 4px 10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>20分</span>
        <span style="font-size: 13px; color: #2A211B; background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 999px; padding: 4px 10px">2人分</span>
        <span style="font-size: 13px; color: #3F6A2A; background: #E4EFD9; border-radius: 999px; padding: 4px 10px">余り物 2品を使用</span>
      </div>
    </div>

    <section aria-label="材料" style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; font-weight: 700">材料</h2>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">
        <div style="display: flex; justify-content: space-between; gap: 12px"><span>豚こま切れ肉 <span style="font-size: 11px; color: #3F6A2A; background: #E4EFD9; border-radius: 999px; padding: 1px 6px">余り物</span></span><span style="color: #6E6157">150g</span></div>
        <div style="display: flex; justify-content: space-between; gap: 12px"><span>キャベツ <span style="font-size: 11px; color: #3F6A2A; background: #E4EFD9; border-radius: 999px; padding: 1px 6px">余り物</span></span><span style="color: #6E6157">1/4玉</span></div>
        <div style="display: flex; justify-content: space-between; gap: 12px"><span>ピーマン</span><span style="color: #6E6157">2個</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; row-gap: 4px; padding-top: 8px; border-top: 1px dashed #EADCCB; font-size: 13px; color: #6E6157">
        <span>しょうが 2cm</span><span>味噌 大さじ1.5</span>
        <span>みりん 大さじ1</span><span>砂糖 小さじ1</span>
        <span>サラダ油 小さじ2</span>
      </div>
    </section>

    <section aria-label="作り方" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; font-weight: 700">作り方</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
        <li style="display: flex; gap: 12px; font-size: 15px; line-height: 1.6"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; background: #F6E2D3; color: #8E3E17; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">1</span>キャベツはざく切り、ピーマンは細切りにする。</li>
        <li style="display: flex; gap: 12px; font-size: 15px; line-height: 1.6"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; background: #F6E2D3; color: #8E3E17; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">2</span>味噌・みりん・砂糖・しょうがを混ぜておく。</li>
        <li style="display: flex; gap: 12px; font-size: 15px; line-height: 1.6"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; background: #F6E2D3; color: #8E3E17; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">3</span>油を熱して豚肉を炒め、色が変わったら野菜を加える。</li>
        <li style="display: flex; gap: 12px; font-size: 15px; line-height: 1.6"><span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; background: #F6E2D3; color: #8E3E17; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">4</span>野菜がしんなりしたら合わせ調味料を回し入れ、全体にからめる。</li>
      </ol>
    </section>

    <section aria-label="食べた感想" style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; font-weight: 700">食べた感想</h2>
      <div role="group" aria-label="評価" style="display: flex; gap: 2px">
        <button type="button" aria-label="1つ星" style="width: 40px; height: 40px; border: none; background: transparent; color: #B4501F; cursor: pointer; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
        <button type="button" aria-label="2つ星" style="width: 40px; height: 40px; border: none; background: transparent; color: #B4501F; cursor: pointer; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
        <button type="button" aria-label="3つ星" style="width: 40px; height: 40px; border: none; background: transparent; color: #B4501F; cursor: pointer; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
        <button type="button" aria-label="4つ星" style="width: 40px; height: 40px; border: none; background: transparent; color: #B4501F; cursor: pointer; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
        <button type="button" aria-label="5つ星" style="width: 40px; height: 40px; border: none; background: transparent; color: #CDBFAE; cursor: pointer; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
      </div>
      <label for="dish-memo" style="font-size: 13px; color: #6E6157">メモ</label>
      <input id="dish-memo" type="text" value="次はにんにくを少し足したい" style="height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #D9CBB9; background: #FBF5EC; padding: 0 12px; font-family: inherit; font-size: 15px; color: #2A211B">
    </section>
  </main>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4501F}a:hover{color:#8E3E17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBF5EC; color: #2A211B; font-family: 'BIZ UDPGothic', sans-serif; overflow: hidden">

  <header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; color: #6E6157">10月12日(月)</div>
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.3">今週のこんだて</h1>
    <div style="font-size: 14px; color: #6E6157">10/13(火) 〜 10/17(土)・5日間</div>
  </header>

  <main style="flex-grow: 1; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

    <section aria-label="明日の夕食" style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 17px">明日 10/13(火)</span>
          <span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #B4501F; border-radius: 999px; padding: 3px 10px">通常</span>
        </div>
        <span style="font-size: 13px; color: #6E6157">約40分</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 10px"><span style="width: 36px; flex-shrink: 0; font-size: 12px; color: #6E6157">主菜</span><span style="font-size: 16px; font-weight: 700">豚こまとキャベツの味噌炒め</span></div>
        <div style="display: flex; align-items: baseline; gap: 10px"><span style="width: 36px; flex-shrink: 0; font-size: 12px; color: #6E6157">副菜</span><span style="font-size: 15px">しめじと小松菜のおひたし</span></div>
        <div style="display: flex; align-items: baseline; gap: 10px"><span style="width: 36px; flex-shrink: 0; font-size: 12px; color: #6E6157">汁物</span><span style="font-size: 15px">豆腐とわかめの味噌汁</span></div>
        <div style="display: flex; align-items: baseline; gap: 10px"><span style="width: 36px; flex-shrink: 0; font-size: 12px; color: #6E6157">主食</span><span style="font-size: 15px">ご飯</span></div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; color: #3F6A2A; background: #E4EFD9; border-radius: 999px; padding: 4px 10px">余り物：キャベツ・豚こま</span>
      </div>
    </section>

    <section aria-label="この先の献立" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; font-weight: 700">この先の献立</h2>
      <div style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 16px; display: flex; flex-direction: column">
        <a href="DishDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #2A211B; border-bottom: 1px solid #F1E7DA; min-height: 44px; box-sizing: border-box">
          <span style="width: 64px; font-size: 13px; color: #6E6157">14(水)</span>
          <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #2D6A86; border-radius: 999px; padding: 2px 8px">時短</span>
          <span style="flex-grow: 1; font-size: 14px">親子丼 ほか1品</span>
        </a>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F1E7DA; min-height: 44px; box-sizing: border-box">
          <span style="width: 64px; font-size: 13px; color: #6E6157">15(木)</span>
          <span style="font-size: 11px; font-weight: 700; color: #6E6157; background: #EFE7DD; border-radius: 999px; padding: 2px 8px">なし</span>
          <span style="flex-grow: 1; font-size: 14px; color: #6E6157">外食</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F1E7DA; min-height: 44px; box-sizing: border-box">
          <span style="width: 64px; font-size: 13px; color: #6E6157">16(金)</span>
          <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #B4501F; border-radius: 999px; padding: 2px 8px">通常</span>
          <span style="flex-grow: 1; font-size: 14px">鶏の照り焼き ほか3品</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 44px; box-sizing: border-box">
          <span style="width: 64px; font-size: 13px; color: #6E6157">17(土)</span>
          <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #B4501F; border-radius: 999px; padding: 2px 8px">通常</span>
          <span style="flex-grow: 1; font-size: 14px">麻婆豆腐 ほか3品</span>
        </div>
      </div>
    </section>

    <a href="Shopping.dc.html" style="display: flex; align-items: center; gap: 14px; background: #F6E2D3; border-radius: 16px; padding: 14px 16px; text-decoration: none; color: #2A211B; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B4501F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"></path><circle cx="10" cy="20.5" r="1"></circle><circle cx="17" cy="20.5" r="1"></circle></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 700">買い物リスト</span><span style="color: #6E6157">6 / 19 品</span></div>
        <div style="height: 6px; background: #FFFFFF; border-radius: 999px; overflow: hidden"><div style="width: 32%; height: 6px; background: #B4501F"></div></div>
      </div>
    </a>

    <a href="PlanCreate.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; border: 2px solid #B4501F; color: #B4501F; font-weight: 700; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      次の献立を計画する
    </a>
  </main>

  <nav aria-label="メインメニュー" style="height: 76px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #EADCCB; padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #B4501F; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
    <a href="Shopping.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"></path><circle cx="10" cy="20.5" r="1"></circle><circle cx="17" cy="20.5" r="1"></circle></svg>買い物</a>
    <a href="Favorites.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>お気に入り</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>

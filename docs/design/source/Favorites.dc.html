<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お気に入り</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4501F}a:hover{color:#8E3E17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBF5EC; color: #2A211B; font-family: 'BIZ UDPGothic', sans-serif; overflow: hidden">

  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 24px">お気に入り</h1>
    <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid #D9CBB9; background: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6157" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">料理を検索</span>
      <input type="search" placeholder="料理名・食材で検索" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #2A211B">
    </label>
    <div role="group" aria-label="区分で絞り込み" style="display: flex; gap: 8px; overflow: hidden">
      <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #2A211B; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0">すべて 12</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; color: #2A211B; font-family: inherit; font-size: 13px; cursor: pointer; flex-shrink: 0">主菜</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; color: #2A211B; font-family: inherit; font-size: 13px; cursor: pointer; flex-shrink: 0">副菜</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; color: #2A211B; font-family: inherit; font-size: 13px; cursor: pointer; flex-shrink: 0">汁物</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; color: #2A211B; font-family: inherit; font-size: 13px; cursor: pointer; flex-shrink: 0">一品</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; color: #2A211B; font-family: inherit; font-size: 13px; cursor: pointer; flex-shrink: 0">15分以内</button>
    </div>
  </header>

  <main style="flex-grow: 1; min-height: 0; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto">
    <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
      <a href="DishDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 14px; background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 16px; text-decoration: none; color: #2A211B">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 11px; font-weight: 700; color: #8E3E17; background: #F6E2D3; border-radius: 6px; padding: 2px 6px; flex-shrink: 0">{{r.course}}</span>
            <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #6E6157">
            <span style="color: #B4501F; letter-spacing: 1px" aria-label="{{r.ratingLabel}}">{{r.stars}}</span>
            <span>{{r.minutes}}分</span>
            <span>最後に作った日 {{r.last}}</span>
          </div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9A894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </main>

  <nav aria-label="メインメニュー" style="height: 76px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #EADCCB; padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
    <a href="Shopping.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"></path><circle cx="10" cy="20.5" r="1"></circle><circle cx="17" cy="20.5" r="1"></circle></svg>買い物</a>
    <a href="Favorites.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #B4501F; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>お気に入り</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { course: '主菜', title: '鮭のちゃんちゃん焼き', rating: 5, minutes: 25, last: '9/28' },
      { course: '一品', title: 'きのこの和風パスタ', rating: 5, minutes: 15, last: '10/02' },
      { course: '主菜', title: '豚こまとキャベツの味噌炒め', rating: 4, minutes: 20, last: '9/24' },
      { course: '汁物', title: '具だくさん豚汁', rating: 4, minutes: 25, last: '9/21' },
      { course: '副菜', title: 'ほうれん草の胡麻和え', rating: 4, minutes: 10, last: '10/06' },
      { course: '主菜', title: '鶏むね肉のレンジ蒸し 香味だれ', rating: 4, minutes: 12, last: '9/30' },
      { course: '副菜', title: 'キャベツとツナの塩昆布和え', rating: 3, minutes: 5, last: '9/15' }
    ];
    const recipes = list.map((r) => ({
      course: r.course,
      title: r.title,
      minutes: r.minutes,
      last: r.last,
      stars: '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating),
      ratingLabel: '評価 ' + r.rating + ' / 5'
    }));
    return { recipes };
  }
}
</script>
</body>
</html>

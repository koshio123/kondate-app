<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4501F}a:hover{color:#8E3E17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FBF5EC; color: #2A211B; font-family: 'BIZ UDPGothic', sans-serif; overflow: hidden">

  <header style="padding: 20px 20px 8px">
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 24px">設定</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto">

    <section aria-label="食べる人" style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #6E6157">食べる人</h2>
      <div style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 16px; display: flex; flex-direction: column">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; border-bottom: 1px solid #F1E7DA; text-decoration: none; color: #2A211B; box-sizing: border-box">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #F6E2D3; color: #8E3E17; font-weight: 700; display: flex; align-items: center; justify-content: center">K</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Ken</span><span style="font-size: 12px; color: #6E6157">31歳・活動量 ふつう・性別 未設定</span></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; border-bottom: 1px solid #F1E7DA; text-decoration: none; color: #2A211B; box-sizing: border-box">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #DCEBF1; color: #1F4F66; font-weight: 700; display: flex; align-items: center; justify-content: center">P</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">パートナー</span><span style="font-size: 12px; color: #6E6157">27歳・活動量 ふつう・性別 未設定</span></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
        <button type="button" style="min-height: 48px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #B4501F; font-weight: 700; cursor: pointer">＋ 家族を追加</button>
      </div>
    </section>

    <section aria-label="食べられないもの" style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #6E6157">食べられないもの</h2>
      <div style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 700">アレルギー</span><span style="font-size: 12px; color: #6E6157">必ず除外</span></div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="font-size: 13px; color: #6E6157">登録なし</span></div>
        </div>
        <div style="height: 1px; background: #F1E7DA"></div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 700">苦手な食材</span></div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: #2A211B; color: #FFFFFF; font-size: 13px">セロリ<span style="font-size: 11px; opacity: 0.85">絶対NG</span></span>
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #B9A894; color: #2A211B; font-size: 13px">レバー<span style="font-size: 11px; color: #6E6157">なるべく避ける</span></span>
          </div>
        </div>
        <button type="button" style="align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px dashed #B9A894; background: transparent; font-family: inherit; font-size: 14px; color: #2A211B; cursor: pointer">＋ 食材を追加</button>
      </div>
    </section>

    <section aria-label="献立の条件" style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #6E6157">献立の条件</h2>
      <div style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 8px 8px 14px; border-bottom: 1px solid #F1E7DA">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">時短の日の調理時間</span><span style="font-size: 12px; color: #6E6157">この時間以内で作れる献立にします</span></div>
          <div style="display: flex; align-items: center; gap: 2px">
            <button type="button" aria-label="5分短くする" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; font-size: 18px; color: #2A211B; cursor: pointer">−</button>
            <span style="width: 52px; text-align: center; font-size: 16px; font-weight: 700">15分</span>
            <button type="button" aria-label="5分長くする" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #D9CBB9; background: #FFFFFF; font-size: 18px; color: #2A211B; cursor: pointer">＋</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">夕食の割合</span><span style="font-size: 12px; color: #6E6157">1日の栄養の目安のうち夕食でとる割合(仮定)</span></div>
          <span style="font-size: 16px; font-weight: 700">1/3</span>
        </div>
      </div>
    </section>

    <section aria-label="アカウント" style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #6E6157">ログインできるアカウント</h2>
      <div style="background: #FFFFFF; border: 1px solid #EADCCB; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; min-height: 48px; padding: 0 14px; border-bottom: 1px solid #F1E7DA; font-size: 14px">[Ken のメールアドレス]<span style="margin-left: auto; font-size: 12px; color: #6E6157">ログイン中</span></div>
        <div style="display: flex; align-items: center; min-height: 48px; padding: 0 14px; font-size: 14px">[パートナーのメールアドレス]</div>
      </div>
      <button type="button" style="margin-top: 8px; height: 48px; border-radius: 999px; border: 1px solid #D9CBB9; background: transparent; font-family: inherit; font-size: 15px; color: #6E6157; cursor: pointer">ログアウト</button>
    </section>
  </main>

  <nav aria-label="メインメニュー" style="height: 76px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #EADCCB; padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
    <a href="Shopping.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"></path><circle cx="10" cy="20.5" r="1"></circle><circle cx="17" cy="20.5" r="1"></circle></svg>買い物</a>
    <a href="Favorites.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6E6157; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>お気に入り</a>
    <a href="Settings.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #B4501F; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
